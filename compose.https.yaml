# Usar junto con compose.yaml. Docker Compose >= 2.24.4.
services:
  app:
    ports: !override []
    environment:
      APP_URL: https://${SITE_DOMAIN:-de-viaje-en-viaje.com}
      SESSION_SECURE_COOKIE: "true"
      TRUSTED_PROXIES: 172.29.240.2
    networks:
      default:
      https_proxy:
        ipv4_address: 172.29.240.3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-de-viaje-en-viaje.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados_https:/data
      - configuracion_https:/config
    networks:
      https_proxy:
        ipv4_address: 172.29.240.2
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  https_proxy:
    ipam:
      config:
        - subnet: 172.29.240.0/29

volumes:
  certificados_https:
  configuracion_https:
